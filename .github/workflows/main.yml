
# Name of the pipeline
# Triggers using on keyword, and on which branches it should trigger
# Jobs -> Job name -> runs-on -> steps -> step name -> uses

name: DevOps Playground Pipeline

on:
  push:
    branches: ["master", "develop"]
    paths-ignore:
      - 'charts/**'
      - 'terraform/**'
      - 'README.md'
  pull_request:
    branches: ["master"]

jobs:
  Checkout-and-Test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Github Repo
        uses: actions/checkout@v4

      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Run htmlhint
        run: htmlhint Frontend/index.html

  Build-Docker-Image:
    needs: Checkout-and-Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> ${GITHUB_ENV}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}

  Update-GitOps-Values:
    needs: Build-Docker-Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image Tag in Helm values.yaml
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)
          sed -i "s|tag:.*|tag: \"${SHORT_SHA}\"|g" charts/frontend-chart/values.yaml
          
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update image tag to ${GITHUB_SHA:0:7} [skip ci]"
          file_pattern: 'charts/frontend-chart/values.yaml'

  Security-Scan:
    needs: Update-GitOps-Values
    runs-on: ubuntu-latest
    steps:

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/devopsplayground:latest
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          





# Name of the pipeline
# Triggers using on keyword, and on which branches it should trigger
# Jobs -> Job name -> runs-on -> steps -> step name -> uses

name: DevOps Playground Pipeline

on:
  push:
    branches: ["master","develop"]
  pull_request:
    branches: ["master"]

jobs:
  Checkout-and-Test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Github Repo
        uses: actions/checkout@v4

      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Run htmlhint
        run: htmlhint ai-news-portal/index.html

  Build-Docker-Image:
    needs: Checkout-and-Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: login to Github reigstery
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  Security-Scan:
    needs: Build-Docker-Image
    runs-on: ubuntu-latest
    steps:

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          



